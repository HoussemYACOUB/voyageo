spring.application.name=Voyageo
spring.config.import=optional:file:../.env[.properties]
server.port=8080
spring.jpa.open-in-view=false
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/voyageo;MODE=PostgreSQL;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# Sécurité JWT
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
providers.travelpayouts.token=${TRAVELPAYOUTS_TOKEN:}
providers.booking.base-url=${BOOKING_API_BASE_URL:https://booking-com15.p.rapidapi.com}
providers.booking.rapidapi-host=${BOOKING_API_HOST:booking-com15.p.rapidapi.com}
providers.booking.rapidapi-key=${RAPIDAPI_KEY:}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS_ENABLE:true}
notifications.email.from=${SMTP_FROM:}
price-alerts.check-interval-ms=${PRICE_ALERTS_CHECK_INTERVAL_MS:21600000}
# Le serveur refuse de démarrer si un secret JWT sûr n’est pas configuré.
# Fin de la configuration applicative.
