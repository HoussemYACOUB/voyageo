spring.application.name=Voyageo
spring.config.import=optional:file:../.env[.properties]
server.port=8080
spring.jpa.open-in-view=false
spring.datasource.url=jdbc:h2:file:./data/voyageo;MODE=PostgreSQL;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# Sécurité JWT
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
providers.travelpayouts.token=${TRAVELPAYOUTS_TOKEN:}
providers.booking.base-url=${BOOKING_API_BASE_URL:https://booking-com15.p.rapidapi.com}
providers.booking.rapidapi-host=${BOOKING_API_HOST:booking-com15.p.rapidapi.com}
providers.booking.rapidapi-key=${RAPIDAPI_KEY:}
# Le serveur refuse de démarrer si un secret JWT sûr n’est pas configuré.
# Fin de la configuration applicative.

